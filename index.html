<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Patterns</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    
    /* Carousel Image */
    .carousel-inner img {
      height: 300px;
      object-fit: cover;
    }

    /* Carousel Container */
    .carousel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Header Above Carousel */
    .banner-header {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #ADD8E6;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
      font-family: Georgia;
    }
  </style>
</head>

<body>

  <!-- Navigation Bar with Background Image -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="#">Crochet Patterns</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="submit.html">Submit Patterns</a></li>
          <li class="nav-item"><a class="nav-link" href="credits.html">Credits</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Centered Carousel with Header -->
  <div class="carousel-container">
    <div class="banner-header">Crochet Patterns</div>

    <div id="Carousel" class="carousel slide w-75" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="Penguin.jpg" class="d-block w-100" alt="Penguin">
          <div class="carousel-caption"><h5>Penguin</h5></div>
        </div>
        <div class="carousel-item">
          <img src="Panda.jpg" class="d-block w-100" alt="Panda">
          <div class="carousel-caption"><h5>Panda</h5></div>
        </div>
        <div class="carousel-item">
          <img src="ducky.jpg" class="d-block w-100" alt="Duck">
          <div class="carousel-caption"><h5>Duck</h5></div>
        </div>
        <div class="carousel-item">
          <img src="jellyghost.jpg" class="d-block w-100" alt="Jelly Ghost">
          <div class="carousel-caption"><h5>Jelly Ghost</h5></div>
        </div>
        <div class="carousel-item">
          <img src="mushroom.jpg" class="d-block w-100" alt="Mushroom">
          <div class="carousel-caption"><h5>Mushrooms</h5></div>
        </div>
      </div>

      <!-- Carousel Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#Carousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#Carousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
