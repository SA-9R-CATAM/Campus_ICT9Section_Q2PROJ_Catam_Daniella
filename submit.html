  </head>

<!-- Recipe Submission Form -->
<div class="container my-5">
  <h1 class="text-center mb-4">Submit Your Pattern</h1>
  
  <div class="card shadow p-4" style="border-radius: 10px; border: 2px solid #0077b6  ;">
    <form id="patternForm">
      <div class="mb-3">
        <label for="crochetProject" class="form-label">Crochet Project</label>
        <input type="text" class="form-control" id="crochetProject" placeholder="Enter Project Name" required>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-control" id="category" required>
          <option>Easy</option>
          <option>Mid</option>
          <option>Hard</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="Materials" class="form-label">Materials</label>
        <textarea class="form-control" id="Materials" rows="3" placeholder="List Materials" required></textarea>
      </div>
      <div class="mb-3">
        <label for="instructions" class="form-label">Instructions</label>
        <textarea class="form-control" id="instructions" rows="3" placeholder="Write the steps" required></textarea>
      </div>
      <div class="mb-3">
        <label for="imageUpload" class="form-label">Upload Image</label>
        <input type="file" class="form-control" id="imageUpload" required>
      </div>
      <button type="button" class="btn btn-primary w-100" onclick="submitPattern()">Submit</button>
    </form>

    <div id="confirmationMessage" class="alert alert-success mt-4 d-none" role="alert">
      Pattern submitted successfully!
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
